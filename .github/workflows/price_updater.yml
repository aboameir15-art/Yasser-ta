name: Crypto Price Updater 🚀

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # تحديث إلى v4 لدعم Node.js الجديد
      - name: Checkout Code
        uses: actions/checkout@v4

      # تحديث إلى v5 لضمان أفضل أداء مع بايثون
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # استخدمنا نسخة أحدث ومستقرة

      - name: Install Dependencies
        run: pip install requests

      - name: Run Updater
        run: python update_script.py
